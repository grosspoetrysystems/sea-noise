# Keeps pinned action SHAs current. New versions wait 7 days before Dependabot
# proposes them (GitHub's default is 3); security updates are never delayed.
# The PR-Agent image is pinned by digest in contribution-intake.yml and bumped by
# hand (see the helicopter skill's references/operating.md), because Dependabot doesn't update `docker://` refs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
