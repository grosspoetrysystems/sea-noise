name: contribution-queue

# Keeps queue state current between pull request events: comments, maintainer
# reviews on fork pull requests (whose own events get a read-only token), and
# the passage of time for nudges and pauses.
on:
  # Privileged by design: labels and comments need a write token. Only trusted
  # default-branch code runs; scripts/dev_checks.py enforces that.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contribution-queue-${{ github.event.issue.number || 'sweep' }}

jobs:
  queue:
    if: ${{ github.event_name != 'issue_comment' || github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out queue from protected default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-base
          persist-credentials: false
          sparse-checkout: scripts
          fetch-depth: 1

      # Security invariant: reads pull request metadata and timelines only; never
      # checks out or executes pull request code.
      - name: Update queue state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HELICOPTER_QUEUE_NUDGE_DAYS: ${{ vars.HELICOPTER_QUEUE_NUDGE_DAYS }}
          HELICOPTER_QUEUE_PAUSE_DAYS: ${{ vars.HELICOPTER_QUEUE_PAUSE_DAYS }}
          HELICOPTER_AUTOMATION_LOGINS: ${{ vars.HELICOPTER_AUTOMATION_LOGINS }}
        run: python3 trusted-base/scripts/pr_queue.py ${PR_NUMBER:+--pr "$PR_NUMBER"}
