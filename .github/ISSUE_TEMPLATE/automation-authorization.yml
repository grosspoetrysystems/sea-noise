name: Automation authorization
description: Request approval for a bot or autonomous contributor to Helicopter
title: "[Automation]: "
labels: ["automation-review"]
body:
  - type: input
    id: owner
    attributes:
      label: Accountable human or organization
    validations:
      required: true
  - type: input
    id: identity
    attributes:
      label: GitHub App or bot identity
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: Narrow purpose and expected value
    validations:
      required: true
  - type: textarea
    id: capabilities
    attributes:
      label: Permissions and capabilities
      description: Include repository writes, commands, network, secrets, tools/MCP, comments, reviews, and merge access.
    validations:
      required: true
  - type: input
    id: volume
    attributes:
      label: Maximum volume
      placeholder: 2 open PRs; 10 comments per day
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data, network, and retention
      description: State external services, allowed hosts, logged data, retention, and any sensitive inputs.
    validations:
      required: true
  - type: input
    id: shutdown
    attributes:
      label: Shutdown and incident contact
    validations:
      required: true
